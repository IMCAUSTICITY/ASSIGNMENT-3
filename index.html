<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Assignment 3 - DOM Implementation</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="card">
    <h1 id="greeting">Hello</h1>

    <section class="boxes" aria-label="Colour boxes">
      <div class="box" data-color="red">red</div>
      <div class="box" data-color="blue">blue</div>
      <div class="box" data-color="green">green</div>
      <div class="box" data-color="yellow">yellow</div>
    </section>

    <div class="greet-row">
      <input type="text" id="name" placeholder="Enter your name" autocomplete="off">
      <button type="button" id="greetBtn">Greet</button>
    </div>
  </main>

  <script src="script.js"></script>
</body>
</html>
